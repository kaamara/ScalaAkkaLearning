akka {
  loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  http.server {
    # czas na dokonczenie obslugiwanych zadan przy zamykaniu
    request-timeout = 20s
  }

  # UWAGA: coordinated-shutdown.exit-jvm NIE moze byc tutaj. Ten plik jest
  # na classpathie takze w testach, a ScalatestRouteTest zamyka ActorSystem
  # po ostatnim tescie — exit-jvm = on ubijaloby wtedy JVM sbt w polowie
  # suite'y (z kodem 0, wiec CI raportowalby zielony build bez artefaktu).
  # Ustawienie jest podane w JAVA_OPTS w Dockerfile, gdzie dotyczy tylko
  # uruchomionego kontenera.
}
