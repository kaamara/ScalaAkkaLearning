# Konfiguracja scrapowania dla lokalnego stacku z compose.yaml.
# Uruchamiane profilem: docker compose --profile observability up -d

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: akka-http-api
    metrics_path: /metrics
    static_configs:
      # "api" to nazwa uslugi z compose.yaml — Docker rozwiazuje ja przez DNS
      # w sieci compose. Port 8080 jest portem WEWNATRZ kontenera, wiec nie ma
      # znaczenia, na co jest zmapowany na hoscie.
      - targets: ["api:8080"]
        labels:
          app: scala-akka-http-api
