name: CI 03-http-api

on:
  push:
    branches: [main]
    paths:
      - '03-http-api/**'
      - '.github/workflows/ci-03-http-api.yml'
      - '.github/workflows/build-project.yml'
  pull_request:
    branches: [main]
    paths:
      - '03-http-api/**'
      - '.github/workflows/ci-03-http-api.yml'
      - '.github/workflows/build-project.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build 03-http-api
    uses: ./.github/workflows/build-project.yml
    with:
      project: 03-http-api
      image: kaamara/scala-akka-http-api
      smoke: |
        # Uruchamiamy kontener i sprawdzamy realne endpointy HTTP. Kontener sprząta trap na końcu.
        docker run -d --name api -p 8080:8080 "$IMAGE" > /dev/null
        trap 'docker rm -f api > /dev/null 2>&1 || true' EXIT
        curl -fsS --retry 10 --retry-all-errors http://localhost:8080/health | grep -q 'UP'
        curl -fsS -X POST http://localhost:8080/counter/increment | grep -q '"count":1'
        curl -fsS http://localhost:8080/metrics | grep -q 'app_counter_value 1'
    secrets: inherit
