services:
  api:
    build: .
    image: kaamara/scala-akka-http-api:local
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Zamykanie trwa ~3s (markNotReady czeka, az LB przestanie slac ruch).
    # Bez tego compose ubija proces SIGKILL-em przed koncem drenazu — exit 137
    # zamiast 143. Odpowiednik terminationGracePeriodSeconds w Kubernetesie.
    stop_grace_period: 30s
    # limity zasobow — bez nich JVM widzi cala pamiec hosta
    deploy:
      resources:
        limits:
          memory: 512M
