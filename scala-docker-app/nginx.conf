server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Backend wystawiony pod tym samym originem co frontend. Przegladarka
    # nie traktuje tego jako zadania cross-origin, wiec nie ma preflightu
    # i aplikacja nie musi zwracac zadnych naglowkow Access-Control-*.
    # Ukosnik na koncu proxy_pass obcina prefiks: /api/messages -> /messages.
    location /api/ {
        proxy_pass http://scala-app:8081/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Twardy limit rozmiaru zadania po stronie proxy — aplikacja
        # sprawdza dlugosc tekstu, ale odrzucenie duzego body tutaj
        # oszczedza backendowi czytania go w calosci.
        client_max_body_size 8k;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
