# Haslo i uzytkownik bazy pochodza z pliku .env (nieversjonowanego).
# Wzorzec do skopiowania: .env.example.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:?ustaw POSTGRES_DB w .env}
    # Bez nazwanego wolumenu "docker compose down" kasowal cala baze razem
    # z kontenerem. Wolumen przezywa down; usuwa go dopiero "down -v".
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Podwojny $$ — pierwszy znak ucieka przed podstawieniem po stronie
      # compose'a, zeby zmienna rozwinela sie dopiero w kontenerze.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  scala-app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    # Port celowo nieopublikowany na hoscie. Jedyne wejscie do backendu
    # prowadzi przez nginx, wiec nie da sie ominac proxy ani trafic na
    # aplikacje bezposrednio z sieci lokalnej.
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Bez limitu JVM widzi cala pamiec hosta i ustawia heap na 1/4 tej wartosci.
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    image: nginx:alpine
    depends_on:
      scala-app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
