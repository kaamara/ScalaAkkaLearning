# Skad Prometheus ma zbierac metryki.
# Wlaczenie: docker compose --profile observability up -d

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: akka-http-api
    metrics_path: /metrics
    static_configs:
      # "api" to nazwa uslugi z compose.yaml - Docker sam zamienia ja
      # na adres. 8080 to port wewnatrz kontenera.
      - targets: ["api:8080"]
        labels:
          app: scala-akka-http-api
