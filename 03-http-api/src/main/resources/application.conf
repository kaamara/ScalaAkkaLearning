akka {
  loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  http.server {
    # maksymalny czas obslugi jednego zadania
    request-timeout = 20s
  }

  # UWAGA: exit-jvm nie moze byc w tym pliku. Ten plik dziala takze
  # podczas testow i ubijalby je w polowie. Jest ustawiony w Dockerfile,
  # gdzie dotyczy tylko uruchomionego kontenera.
}
