name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11

      - name: Install SBT
        run: |
          curl -fL https://github.com/sbt/sbt/releases/download/v1.9.7/sbt-1.9.7.tgz | tar xz
          echo "$PWD/sbt/bin" >> $GITHUB_PATH

      - name: Cache SBT
        uses: actions/cache@v3
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
          key: sbt-${{ hashFiles('01-kalkulator/build.sbt') }}

      - name: Compile
        run: cd 01-kalkulator && sbt compile

      - name: Test
        run: cd 01-kalkulator && sbt test

      - name: Build JAR
        run: cd 01-kalkulator && sbt assembly

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./01-kalkulator
          push: true
          tags: kaamara/scala-akka-kalkulator:latest

  build-licznik:
