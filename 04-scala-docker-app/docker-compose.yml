services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mojabaza}
    # Dane bazy trzymane poza kontenerem, zeby przetrwaly "down".
    # Uwaga: zmiana hasla dziala tylko na nowym wolumenie.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Podwojny $$ - zmienna ma sie rozwinac w kontenerze, nie tutaj.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  scala-app:
    build: .
    # Czeka, az baza bedzie gotowa.
    depends_on:
      db:
        condition: service_healthy
    # Te same wartosci domyslne co wyzej, tylko pod innymi nazwami.
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mojabaza}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      HTTP_PORT: "${BACKEND_PORT:-8081}"
    # Port widoczny tylko wewnatrz sieci compose. Z zewnatrz wchodzi sie
    # przez nginx, wiec backendu nie da sie ominac.
    expose:
      - "${BACKEND_PORT:-8081}"
    healthcheck:
      # CMD-SHELL, zeby $$HTTP_PORT rozwinelo sie w kontenerze.
      # 127.0.0.1 zamiast localhost - na alpine localhost wskazuje najpierw
      # na IPv6, a serwer slucha tylko po IPv4.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:$${HTTP_PORT}/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Bez limitu Java widzi cala pamiec komputera i bierze jej za duzo.
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    image: nginx:alpine
    depends_on:
      scala-app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_PORT: "${BACKEND_PORT:-8081}"
      NGINX_ENVSUBST_FILTER: "BACKEND_"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      # Tu tez 127.0.0.1 - nginx slucha tylko po IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
