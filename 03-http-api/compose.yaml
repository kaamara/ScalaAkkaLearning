# Uruchomienie: docker compose up --build
# API: http://localhost:8080
services:
  api:
    build: .
    image: kaamara/scala-akka-http-api:local
    # Port zmienisz jedna zmienna: HTTP_PORT=9090 docker compose up
    # (wtedy popraw tez adres w prometheus.yml).
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    environment:
      HTTP_PORT: "${HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${HTTP_PORT}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Zamykanie trwa okolo 3 sekund. Bez tego Docker ubilby aplikacje
    # w polowie i zostalby blad zamiast czystego wyjscia.
    stop_grace_period: 30s
    # Bez limitu Java widzi cala pamiec komputera i bierze jej za duzo.
    deploy:
      resources:
        limits:
          memory: 512M

  # Prometheus nie startuje przy zwyklym "up".
  # Wlaczenie: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    # Czeka, az API bedzie gotowe, zeby pierwszy odczyt sie udal.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
