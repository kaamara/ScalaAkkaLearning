name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Zaden job nic nie zapisuje w repo, wiec dajemy tylko prawo do odczytu.
permissions:
  contents: read

# Nowy push anuluje poprzedni przebieg na tej samej galezi.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_NAMESPACE: kaamara

jobs:
  # ---------------------------------------------------------------- testy --
  # Te same kroki dla kazdego z czterech projektow.
  # fail-fast: false, zeby blad w jednym nie ukryl wyniku pozostalych.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-kalkulator
          - 02-licznik
          - 03-http-api
          - 04-scala-docker-app
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Ta sama wersja Javy co w obrazach Dockera.
          java-version: '17'
          # Zapamietuje pobrane biblioteki miedzy przebiegami.
          cache: sbt

      # Wersje sbt bierze z project/build.properties danego projektu.
      - uses: sbt/setup-sbt@v1

      - name: Kompilacja i testy
        run: sbt -batch test

  # --------------------------------------------------------------- obrazy --
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: 01-kalkulator
            image: scala-akka-kalkulator
          - project: 02-licznik
            image: scala-akka-licznik
          - project: 03-http-api
            image: scala-akka-http-api
          - project: 04-scala-docker-app
            image: scala-docker-app
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Logujemy sie tylko wtedy, gdy naprawde wysylamy obraz.
      - name: Login do Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadane obrazu
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          # Tag z numerem commita wskazuje dokladnie ten build.
          # :latest powstaje tylko z galezi glownej.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          # Przy pull requescie obraz sie buduje, ale nigdzie nie trafia.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  # --------------------------------------------------- test calego stosu --
  # Sam build obrazu nie mowi, czy aplikacja dogaduje sie z baza.
  # Tutaj stawiamy cala aplikacje i klikamy po niej jak uzytkownik.
  compose-smoke:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-scala-docker-app
    steps:
      - uses: actions/checkout@v4

      # Compose ma wartosci domyslne, ale sprawdzamy tez sciezke z .env.
      - name: Przygotuj .env
        run: cp .env.example .env

      - name: Start stosu
        run: docker compose up -d --build --wait

      # Caly ruch idzie przez nginx - tak samo jak z przegladarki.
      - name: Frontend serwowany przez nginx
        run: curl -fsS --retry 5 --retry-delay 3 http://localhost:8080/ | grep -q 'Panel Sterowania'

      - name: Backend odpowiada przez proxy
        run: curl -fsS http://localhost:8080/api/ | grep -q 'Backend gotowy'

      - name: Zapis i odczyt z bazy
        run: |
          curl -fsS -X POST --data 'smoke-test-ci' http://localhost:8080/api/add
          curl -fsS http://localhost:8080/api/messages | grep -q 'smoke-test-ci'

      - name: Pusta wiadomosc odrzucona (400)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '' http://localhost:8080/api/add)
          test "$code" = "400" || { echo "oczekiwano 400, dostalem $code"; exit 1; }

      - name: Logi przy bledzie
        if: failure()
        run: docker compose logs --no-color

      - name: Sprzatanie
        if: always()
        run: docker compose down -v
