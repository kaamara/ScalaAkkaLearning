services:
  api:
    build: .
    image: kaamara/scala-akka-http-api:local
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Zamykanie trwa ~3s (markNotReady czeka, az LB przestanie slac ruch).
    # Bez tego compose ubija proces SIGKILL-em przed koncem drenazu — exit 137
    # zamiast 143. Odpowiednik terminationGracePeriodSeconds w Kubernetesie.
    stop_grace_period: 30s
    # limity zasobow — bez nich JVM widzi cala pamiec hosta
    deploy:
      resources:
        limits:
          memory: 512M

  # Profil "observability" — nie startuje przy zwyklym `docker compose up`.
  # Wlaczenie: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    # czeka na healthcheck api, zeby pierwszy scrape nie poszedl w pustke
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
